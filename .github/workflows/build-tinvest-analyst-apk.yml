name: build-tinvest-analyst-apk

on:
  push:
    branches:
      - claude/android-exchange-trading-app-bj64fu
    paths:
      - 'tinvest-analyst-android/**'
      - '.github/workflows/build-tinvest-analyst-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinvest-analyst-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tinvest-analyst-debug-apk
          path: tinvest-analyst-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
