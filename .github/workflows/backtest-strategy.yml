name: backtest-strategy

# Прогон стратегии бота по настоящим котировкам.
# Данные тянет этот workflow из двух открытых источников без ключей:
#   ISS Московской биржи — российские акции, валюты и индексы;
#   Stooq — мировые индексы, валютные пары, товарные фьючерсы и крипта.
# Считает — тот же код Kotlin, которым торгует приложение.

on:
  workflow_dispatch:
    inputs:
      years:
        description: Глубина истории, лет
        default: "10"
  push:
    paths:
      - '.github/workflows/backtest-strategy.yml'
      - 'tinvest-trader-android/app/src/test/**'
      - 'tinvest-trader-android/app/src/main/java/com/tinvesttrader/trading/**'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download candles
        env:
          YEARS: ${{ github.event.inputs.years || '10' }}
        run: |
          set -uo pipefail
          # Сообщения загрузки дублируются в файл: в хвосте лога их иначе не
          # видно, а без них непонятно, какой инструмент не доехал и почему.
          exec > >(tee /tmp/fetch.log) 2>&1
          OUT=tinvest-trader-android/app/build/backtest-data
          mkdir -p "$OUT"
          FROM=$(date -u -d "$YEARS years ago" +%Y-%m-%d)
          D1=$(date -u -d "$YEARS years ago" +%Y%m%d)
          D2=$(date -u +%Y%m%d)

          # Имя файла: <класс>__<инструмент>. По классу отчёт группирует итоги —
          # вопрос ведь не «работает ли на Сбере», а «на каком классе активов».
          # ISS отдаёт максимум 500 свечей за запрос, поэтому листаем курсором.
          moex() {
            local engine="$1" market="$2" sec="$3" name="$4"
            local start=0 total=0
            local file="$OUT/$name.csv"
            echo "open,high,low,close,volume,begin" > "$file"
            while : ; do
              url="https://iss.moex.com/iss/engines/$engine/markets/$market/securities/$sec/candles.json"
              rows=$(curl -sS --fail --max-time 60 "$url?from=$FROM&interval=24&start=$start" \
                | jq -r '.candles.data[]? | [.[0],.[2],.[3],.[1],.[5],.[6]] | @csv' \
                | tr -d '"') || { echo "MOEX $sec: запрос не прошёл"; rm -f "$file"; return; }
              count=$(printf '%s' "$rows" | grep -c . || true)
              [ "$count" -eq 0 ] && break
              printf '%s\n' "$rows" >> "$file"
              total=$((total + count))
              start=$((start + count))
              [ "$count" -lt 500 ] && break
            done
            if [ "$total" -lt 400 ]; then
              echo "MOEX $sec: только $total свечей — пропускаем"
              rm -f "$file"
            else
              echo "MOEX $sec -> $name: $total свечей"
            fi
          }

          # Мировые инструменты берём из открытого chart-эндпоинта Yahoo:
          # он отдаёт десятилетнюю дневную историю по индексам, валютным
          # парам, непрерывным товарным фьючерсам и крипте без ключа.
          # Stooq, который напрашивался первым, отвечает раннеру
          # JS-заглушкой вместо данных — проверено отдельным прогоном.
          yahoo() {
            local sym="$1" name="$2"
            local raw=/tmp/yahoo.json
            local code
            code=$(curl -sS --max-time 60 -o "$raw" -w '%{http_code}' \
              -A "Mozilla/5.0 (X11; Linux x86_64)" \
              "https://query1.finance.yahoo.com/v8/finance/chart/$sym?range=10y&interval=1d") || {
                echo "Yahoo $sym: запрос не прошёл"; return; }
            if [ "$code" != "200" ]; then
              echo "Yahoo $sym: HTTP $code"; return
            fi
            local file="$OUT/$name.csv"
            echo "open,high,low,close,volume,begin" > "$file"
            jq -r '.chart.result[0] as $r
              | ($r.indicators.quote[0]) as $q
              | range(0; ($r.timestamp | length))
              | select($q.close[.] != null and $q.open[.] != null
                       and $q.high[.] != null and $q.low[.] != null)
              | [ $q.open[.], $q.high[.], $q.low[.], $q.close[.],
                  ($q.volume[.] // 0), ($r.timestamp[.] | todate) ]
              | @csv' "$raw" 2>/dev/null | tr -d '"' >> "$file"
            local total=$(( $(wc -l < "$file") - 1 ))
            if [ "$total" -lt 400 ]; then
              echo "Yahoo $sym: только $total свечей — пропускаем"
              rm -f "$file"
            else
              echo "Yahoo $sym -> $name: $total свечей"
            fi
            sleep 1
          }

          # --- Российские акции -------------------------------------------
          for t in SBER GAZP LKOH GMKN ROSN NVTK PLZL PHOR MGNT TATN CHMF MTSS \
                   NLMK MAGN ALRS AFLT MOEX RTKM SNGS IRAO HYDR FEES VTBR SIBN; do
            moex stock shares "$t" "rf-akcii__$t"
          done

          # --- Валюты Московской биржи ------------------------------------
          moex currency selt USD000UTSTOM "rf-valyuta__USDRUB"
          moex currency selt EUR_RUB__TOM "rf-valyuta__EURRUB"
          moex currency selt CNYRUB_TOM   "rf-valyuta__CNYRUB"

          # --- Индексы Московской биржи -----------------------------------
          for i in IMOEX RTSI MOEXOG MOEXMM MOEXFN; do
            moex stock index "$i" "rf-indeks__$i"
          done

          # --- Мировые индексы --------------------------------------------
          yahoo "%5EGSPC"  "mir-indeks__SP500"
          yahoo "%5ENDX"   "mir-indeks__NASDAQ100"
          yahoo "%5EGDAXI" "mir-indeks__DAX"
          yahoo "%5EN225"  "mir-indeks__NIKKEI"
          yahoo "%5EFTSE"  "mir-indeks__FTSE100"
          yahoo "%5EHSI"   "mir-indeks__HANGSENG"

          # --- Мировые акции ----------------------------------------------
          # Нужны, чтобы понять, провал на российских акциях — это свойство
          # рынка или свойство класса активов вообще.
          for t in AAPL MSFT XOM JPM KO NVDA; do
            yahoo "$t" "mir-akcii__$t"
          done

          # --- Валютные пары ----------------------------------------------
          for p in EURUSD USDJPY GBPUSD AUDUSD USDCHF USDCNY; do
            yahoo "$p%3DX" "mir-valyuta__$p"
          done

          # --- Товарные фьючерсы (непрерывные серии) ----------------------
          # Отдельный контракт живёт квартал, поэтому десятилетнюю историю
          # даёт только склеенная серия — на ней и проверяем.
          yahoo "GC=F" "tovary__ZOLOTO"
          yahoo "SI=F" "tovary__SEREBRO"
          yahoo "PL=F" "tovary__PLATINA"
          yahoo "HG=F" "tovary__MED"
          yahoo "CL=F" "tovary__NEFT_WTI"
          yahoo "BZ=F" "tovary__NEFT_BRENT"
          yahoo "NG=F" "tovary__GAZ"
          yahoo "ZW=F" "tovary__PSHENICA"
          yahoo "ZC=F" "tovary__KUKURUZA"

          # --- Крипта ------------------------------------------------------
          yahoo "BTC-USD" "kripta__BTCUSD"
          yahoo "ETH-USD" "kripta__ETHUSD"

          echo "Итого файлов: $(ls -1 "$OUT" | wc -l)"

      - name: Run strategy backtest
        working-directory: tinvest-trader-android
        run: |
          export BACKTEST_DATA_DIR="$PWD/app/build/backtest-data"
          set -o pipefail
          gradle :app:testDebugUnitTest \
            --tests 'com.tinvesttrader.trading.StrategyBacktestReport' \
            --no-daemon 2>&1 | tee /tmp/gradle.log || {
              echo "=== ошибки компиляции ==="
              grep -E "^e: " /tmp/gradle.log || true
              exit 1
            }

      - name: Где у системы край — разбор по режимам рынка
        working-directory: tinvest-trader-android
        run: |
          export REGIME_DATA_DIR="$PWD/app/build/backtest-data"
          set -o pipefail
          # Тесты уже прогонялись шагом выше, и без сброса Gradle считает задачу
          # выполненной: отчёт молча не печатается.
          gradle :app:cleanTestDebugUnitTest :app:testDebugUnitTest \
            --tests 'com.tinvesttrader.trading.MarketRegimeReport' \
            --no-daemon 2>&1 | tee /tmp/regime.log || {
              echo "=== ошибки компиляции ==="
              grep -E "^e: " /tmp/regime.log || true
              exit 1
            }

      - name: Что удалось скачать
        if: always()
        run: cat /tmp/fetch.log
