name: backtest-strategy

# Прогон стратегии бота по настоящим котировкам Московской биржи.
# Данные тянет этот workflow (ISS MOEX, открытый API без ключей), считает —
# тот же код Kotlin, которым торгует приложение.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: Тикеры Московской биржи через пробел
        default: SBER LKOH PHOR PLZL
      years:
        description: Глубина дневной истории, лет
        default: "3"
  push:
    paths:
      - '.github/workflows/backtest-strategy.yml'
      - 'tinvest-trader-android/app/src/test/**'
      - 'tinvest-trader-android/app/src/main/java/com/tinvesttrader/trading/**'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download candles from MOEX
        env:
          TICKERS: ${{ github.event.inputs.tickers || 'SBER LKOH PHOR PLZL' }}
          YEARS: ${{ github.event.inputs.years || '3' }}
        run: |
          set -euo pipefail
          OUT=tinvest-trader-android/app/build/backtest-data
          mkdir -p "$OUT"

          # ISS отдаёт не больше 500 свечей за запрос, поэтому листаем курсором.
          fetch() {
            local ticker="$1" interval="$2" from="$3" name="$4"
            local start=0 total=0
            echo "open,high,low,close,volume,begin" > "$OUT/$name.csv"
            while : ; do
              url="https://iss.moex.com/iss/engines/stock/markets/shares/securities/$ticker/candles.json"
              url="$url?from=$from&interval=$interval&start=$start"
              rows=$(curl -sS --fail --max-time 60 "$url" \
                | jq -r '.candles.data[] | [.[0],.[2],.[3],.[1],.[5],.[6]] | @csv' \
                | tr -d '"')
              count=$(printf '%s' "$rows" | grep -c . || true)
              [ "$count" -eq 0 ] && break
              printf '%s\n' "$rows" >> "$OUT/$name.csv"
              total=$((total + count))
              start=$((start + count))
              [ "$count" -lt 500 ] && break
            done
            echo "$name: $total свечей"
          }

          DAY_FROM=$(date -u -d "$YEARS years ago" +%Y-%m-%d)
          HOUR_FROM=$(date -u -d "6 months ago" +%Y-%m-%d)
          for ticker in $TICKERS; do
            fetch "$ticker" 24 "$DAY_FROM" "${ticker}-dnevnye-${YEARS}g"
            fetch "$ticker" 60 "$HOUR_FROM" "${ticker}-chasovye-6mes"
          done

      - name: Run strategy backtest
        working-directory: tinvest-trader-android
        run: |
          export BACKTEST_DATA_DIR="$PWD/app/build/backtest-data"
          set -o pipefail
          gradle :app:testDebugUnitTest \
            --tests 'com.tinvesttrader.trading.SberBacktestReport' \
            --no-daemon 2>&1 | tee /tmp/gradle.log || {
              echo "=== ошибки компиляции ==="
              grep -E "^e: |^w: .*error" /tmp/gradle.log || true
              exit 1
            }

      - name: Print report
        if: always()
        working-directory: tinvest-trader-android
        run: |
          for f in app/build/backtest-data/*.csv; do
            echo "$f: $(wc -l < "$f") строк"
          done
