name: backtest-intraday-fx

# Внутридневная торговля валютными фьючерсами (доллар, юань) с плечом 1/3/5.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/backtest-intraday-fx.yml'
      - '.github/scripts/moex-futures-intraday.py'
      - 'tinvest-trader-android/app/src/test/java/com/tinvesttrader/trading/IntradayFxLeverageReport.kt'

jobs:
  intraday-fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download intraday candles
        run: |
          OUT=tinvest-trader-android/app/build/intraday-fx
          mkdir -p "$OUT"
          Y=$(date -u +%Y)
          python3 .github/scripts/moex-futures-intraday.py "$OUT" Si 10 $((Y - 2)) $Y || echo "Si 10m не удалось"
          python3 .github/scripts/moex-futures-intraday.py "$OUT" CR 10 $((Y - 2)) $Y || echo "CR 10m не удалось"
          python3 .github/scripts/moex-futures-intraday.py "$OUT" Si 60 $((Y - 6)) $Y || echo "Si 60m не удалось"
          python3 .github/scripts/moex-futures-intraday.py "$OUT" CR 60 $((Y - 3)) $Y || echo "CR 60m не удалось"
          ls -la "$OUT"
      - name: Run intraday FX report
        working-directory: tinvest-trader-android
        run: |
          export INTRADAY_FX_DIR="$PWD/app/build/intraday-fx"
          set -o pipefail
          gradle :app:testDebugUnitTest --tests 'com.tinvesttrader.trading.IntradayFxLeverageReport' --no-daemon 2>&1 | tee /tmp/gradle.log || {
            grep -E "^e: " /tmp/gradle.log || true; exit 1; }
