name: build-tinvest-trader-apk

on:
  push:
    branches:
      - claude/android-exchange-trading-app-bj64fu
    paths:
      - 'tinvest-trader-android/**'
      - '.github/workflows/build-tinvest-trader-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinvest-trader-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tinvest-trader-debug-apk
          path: tinvest-trader-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
